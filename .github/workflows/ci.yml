name: CI

# NOTE: Tag-triggered build/publish to PyPI lives in `release.yml`.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # `hatch-vcs` git tag versioning
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ruff

      - run: uv sync

      - run: uv run pkgdx-lint-hook
      - run: uv run pkgdx-format-hook

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: pytest-${{ matrix.os }}
          python-version: "3.13"

      - run: uv sync

      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - run: uv run coverage xml

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: conformance-${{ matrix.os }}
          python-version: "3.13"

      - run: uv sync

      - name: Verify conformance specimens are installed
        run: uv run python -c "import numpy, polars, pydantic, fastmcp"

      - run: uv run pytest -m conformance -v
