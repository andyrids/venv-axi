name: Release

# Builds & publishes `venv-axi` to PyPI via Trusted Publishing (OIDC)
on:
  release:
    # NOTE: `published` fires for a prerelease too; `prereleased` is kept so a
    # release later demoted to prerelease still builds.
    types: [published, prereleased]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set version from tag
        run: |
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VENV_AXI=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: uv build

      - uses: actions/upload-artifact@v8
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: uv publish
