name: Release

# Builds & publishes `venv-axi` to PyPI via Trusted Publishing (OIDC)
on:
  release:
    # NOTE: `published` fires for a prerelease too; `prereleased` is kept so a
    # release later demoted to prerelease still builds.
    types: [published, prereleased]

jobs:
  # NOTE: `build` starts from the tag ref the instant the release event fires, independent of
  # `ci.yml`'s own trigger - nothing otherwise stops a release from publishing a commit CI is
  # still validating, never validated, or went red on. This job fails the workflow before `build`
  # unless a CI run for the released commit concluded `success`; a PyPI filename is reserved
  # permanently, so the check runs before the build it would be too late to undo.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a successful CI run for the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No CI run exists for ${GITHUB_SHA} - nothing has validated this commit"
            exit 1
          fi
          for _ in $(seq 1 120); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')
            [ "$status" = "completed" ] && break
            echo "CI run ${run_id} is ${status}; waiting"
            sleep 15
          done
          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run ${run_id} for ${GITHUB_SHA} concluded ${conclusion:-in-progress}"
            exit 1
          fi

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set version from tag
        run: |
          echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VENV_AXI=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - run: uv publish
